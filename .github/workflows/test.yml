name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Pester and PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Show PowerShell version
        shell: powershell
        run: |
          $PSVersionTable | Out-String
          'Is64BitProcess: ' + [Environment]::Is64BitProcess
          'LanguageMode: ' + $ExecutionContext.SessionState.LanguageMode

      - name: Analyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $found = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($found.Count) {
            $found | Format-List RuleName, ScriptName, Line, Message | Out-String | Write-Host
            exit 1
          }

      - name: Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
